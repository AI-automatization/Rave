<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Background radial glow -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1C0B38"/>
      <stop offset="60%" stop-color="#110820"/>
      <stop offset="100%" stop-color="#0A0912"/>
    </radialGradient>

    <!-- W gradient (left arm) -->
    <linearGradient id="wGrad" x1="88" y1="113" x2="250" y2="283" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Glow blur behind W -->
    <filter id="glowFx" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="blur"/>
    </filter>

    <!-- Shadow for left arm on right arm -->
    <filter id="armShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)"/>

  <!-- Ambient purple glow behind W mark -->
  <ellipse cx="200" cy="205" rx="130" ry="105" fill="#7C3AED" opacity="0.30" filter="url(#glowFx)"/>

  <!-- ── W Mark (centred, 2.5× scale of base 120×100) ──────── -->
  <!-- base: M 15,15 → (15*2.5+87.5, 15*2.5+75) = (125, 112.5) -->
  <!-- scale 2.5, translate(87.5, 75) so mark spans ~88–313 x, 113–283 y -->

  <!-- Right arm (behind) -->
  <path
    d="M 312,113 L 234,283 L 200,188 L 150,113"
    stroke="#7C3AED"
    stroke-width="55"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Left arm (in front) -->
  <path
    d="M 88,113 L 165,283 L 200,188 L 250,113"
    stroke="url(#wGrad)"
    stroke-width="55"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#armShadow)"
  />
</svg>
