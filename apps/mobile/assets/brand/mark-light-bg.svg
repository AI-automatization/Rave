<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Light background -->
    <radialGradient id="bgLight" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F3EEFF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </radialGradient>

    <!-- W gradient -->
    <linearGradient id="wGradL" x1="88" y1="113" x2="250" y2="283" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <!-- Subtle shadow for light bg -->
    <filter id="armShadowL" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#7C3AED" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Light background -->
  <rect width="400" height="400" rx="48" fill="url(#bgLight)"/>

  <!-- Right arm (behind) -->
  <path
    d="M 312,113 L 234,283 L 200,188 L 150,113"
    stroke="#7C3AED"
    stroke-width="55"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Left arm (in front) -->
  <path
    d="M 88,113 L 165,283 L 200,188 L 250,113"
    stroke="url(#wGradL)"
    stroke-width="55"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#armShadowL)"
  />
</svg>
