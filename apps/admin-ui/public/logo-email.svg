<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 52" fill="none">
  <defs>
    <linearGradient id="wG" x1="4" y1="6" x2="40" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
    </filter>
  </defs>

  <!-- Glow behind left arm -->
  <path d="M 6,8 L 20,44 L 26,26 L 36,8"
        stroke="#7C3AED" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.35" filter="url(#glow)"/>

  <!-- Right arm (dark purple, behind) -->
  <path d="M 46,8 L 32,44 L 26,26 L 16,8"
        stroke="#7C3AED" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left arm (gradient, front) -->
  <path d="M 6,8 L 20,44 L 26,26 L 36,8"
        stroke="url(#wG)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "we" — light -->
  <text x="62" y="35" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="300" fill="rgba(255,255,255,0.50)">we</text>
  <!-- "Watch" — bold white -->
  <text x="95" y="35" font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="800" fill="#FFFFFF">Watch</text>
</svg>
