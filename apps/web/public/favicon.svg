<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="36" fill="#0A0A12"/>
  <defs>
    <linearGradient id="frontG" x1="35" y1="20" x2="100" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="backG" x1="165" y1="20" x2="100" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B0764" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Back arm: right side of W (darker, behind) -->
  <path d="M 100,72 L 118,172 L 165,22"
        stroke="url(#backG)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Front arm: left side of W (lighter, on top) -->
  <path d="M 35,22 L 82,172 L 100,72"
        stroke="url(#frontG)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
