<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 296 80" fill="none">
  <defs>
    <!-- W gradient -->
    <linearGradient id="wGD" x1="8" y1="7" x2="68" y2="73" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Arm shadow -->
    <filter id="sdD" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ── W Mark (scaled 0.75×, centred in 80px height) ─────── -->
  <!-- base 120×100 → 90×75 visual. Translate y=(80-75)/2=2.5≈3 -->
  <!-- stroke 22 × 0.75 = 16.5 -->

  <!-- Right arm -->
  <path
    d="M 79,14 L 56,65 L 45,37 L 30,14"
    stroke="#7C3AED"
    stroke-width="16.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    transform="translate(0,3)"
  />

  <!-- Left arm -->
  <path
    d="M 11,14 L 35,65 L 45,37 L 60,14"
    stroke="url(#wGD)"
    stroke-width="16.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#sdD)"
    transform="translate(0,3)"
  />

  <!-- ── Wordmark ──────────────────────────────────────────── -->
  <text
    x="103"
    y="52"
    font-family="Inter, -apple-system, 'Helvetica Neue', sans-serif"
    font-size="38"
    letter-spacing="-0.5"
    fill="white"
  >
    <tspan font-weight="300" fill="rgba(255,255,255,0.60)">we</tspan><tspan font-weight="800">Watch</tspan>
  </text>
</svg>
