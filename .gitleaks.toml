title = "gitleaks config — Rave/WeWatch"

[extend]
useDefault = true

# Firebase client config (google-services.json / GoogleService-Info.plist) ships
# in every Android/iOS build and is meant to be public — Google's own docs state
# these keys are not secrets; access is controlled via API key restrictions and
# Firebase Security Rules, not by hiding the key. See:
# https://firebase.google.com/docs/projects/api-keys
[allowlist]
description = "Firebase client config files — keys are public by design"
paths = [
  '''apps/mobile/google-services\.json''',
  '''apps/mobile/GoogleService-Info\.plist''',
]
