name: Secret Scan

# Экономия минут Actions: быстрые пуши подряд отменяют предыдущий прогон
# той же ветки. Прежде каждый push держал свою очередь до конца, и на
# активной ветке половина минут уходила на прогоны, результат которых
# уже никому не нужен.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz
          echo "2f92ab3b8e08319ac30836c32b90818e01519c3a4982771e4f45a7f5607872f7  gitleaks_8.22.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f gitleaks_8.22.1_linux_x64.tar.gz gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source=. --redact --log-opts="HEAD~1..HEAD"
