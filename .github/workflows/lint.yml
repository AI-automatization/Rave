name: TypeScript Check

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: [shared, auth, user, content, watch-party, notification, admin]
        include:
          - service: shared
            path: shared
          - service: auth
            path: services/auth
          - service: user
            path: services/user
          - service: content
            path: services/content
          - service: watch-party
            path: services/watch-party
          - service: notification
            path: services/notification
          - service: admin
            path: services/admin

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Build shared (required by services)
        if: matrix.service != 'shared'
        run: cd shared && npm run build

      - name: Typecheck ${{ matrix.service }}
        run: cd ${{ matrix.path }} && npm run typecheck
