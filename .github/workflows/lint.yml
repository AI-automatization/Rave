name: TypeScript Check

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: [shared, auth, user, content, watch-party, notification, admin]
        include:
          - service: shared
            path: shared
          - service: auth
            path: services/auth
          - service: user
            path: services/user
          - service: content
            path: services/content
          - service: watch-party
            path: services/watch-party
          - service: notification
            path: services/notification
          - service: admin
            path: services/admin

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Build shared (required by services)
        if: matrix.service != 'shared'
        run: cd shared && npm run build

      - name: Typecheck ${{ matrix.service }}
        run: cd ${{ matrix.path }} && npm run typecheck

  frontend:
    name: Front-end — ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, web, app-web, admin-ui]
        include:
          - app: mobile
            workspace: wewatch-mobile
          - app: web
            workspace: web
          - app: app-web
            workspace: app-web
          - app: admin-ui
            workspace: '@cinesync/admin-ui'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root deps
        run: npm ci --legacy-peer-deps
      - name: Build shared (required by services some front-ends import from)
        run: npm run build --workspace=@cinesync/shared
      # continue-on-error on the whole job (#81 item 5's actual goal is visibility, not a new
      # blocking gate): apps/web currently carries real pre-existing findings this job would
      # otherwise turn into an immediate, permanently-red required check — 6 react-hooks/*
      # errors (set-state-in-effect, refs-during-render) that need a human verifying behavior
      # in a browser after each fix, not a blind mechanical edit, plus a dual-@types/react
      # ReactNode/bigint typecheck error (same class already worked around in
      # apps/mobile/LanguageTransition.tsx). Once those are cleared this can drop
      # continue-on-error and become a real required check.
      - name: Typecheck ${{ matrix.app }}
        continue-on-error: true
        run: npm run typecheck --workspace="${{ matrix.workspace }}" --if-present
      - name: Lint ${{ matrix.app }}
        continue-on-error: true
        run: npm run lint --workspace="${{ matrix.workspace }}" --if-present
      - name: Test ${{ matrix.app }}
        if: matrix.app == 'mobile'
        continue-on-error: true
        run: npm test --workspace=wewatch-mobile

  size-report:
    name: Large file report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 (real prod CI failure 2026-08-13, verified live) — actions/checkout's
      # default shallow (depth-1) checkout of the PR merge ref, combined with a separately
      # shallow-fetched base branch below, gives two disconnected single-commit histories with
      # no shared ancestor at all: `git diff origin/dev...HEAD` needs a merge-base to compute the
      # triple-dot diff and fails outright ("no merge base") rather than just being inaccurate.
      # Fetching full history here means the base branch's fetch afterward reuses commit objects
      # that already exist locally instead of creating a disconnected shallow tip.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Report files over 500 lines changed in this PR
        run: |
          git fetch origin ${{ github.base_ref }}
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx')
          for f in $changed; do
            [ -f "$f" ] || continue
            n=$(wc -l < "$f")
            [ "$n" -gt 500 ] && echo "::warning file=$f::$f is now $n lines"
          done
          exit 0
