name: Deploy — Staging

on:
  push:
    branches: [develop]

jobs:
  deploy-staging:
    name: Deploy to Railway (Staging)
    runs-on: ubuntu-latest
    environment: staging

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service:
          - auth
          - user
          - content
          - watch-party
          - battle
          - notification
          - admin

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }} to Railway (staging)
        run: railway up --service ${{ matrix.service }}-staging --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
