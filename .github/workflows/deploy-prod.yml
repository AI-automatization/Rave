name: Deploy — Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Production ga deploy qilmoqchimisiz? (yes)"
        required: true
        default: 'no'

permissions:
  contents: read

jobs:
  # Detect which services actually changed — only those get redeployed.
  # Filter name == Railway service name (note: dir services/watch-party → service "watch-part").
  # shared/** change fans out to every backend service.
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth: ['services/auth/**', 'shared/**']
            user: ['services/user/**', 'shared/**']
            content: ['services/content/**', 'shared/**']
            watch-part: ['services/watch-party/**', 'shared/**']
            notification: ['services/notification/**', 'shared/**']
            admin: ['services/admin/**', 'shared/**']
            web: ['apps/web/**']
            app-web: ['apps/app-web/**']
            admin-ui: ['apps/admin-ui/**']

  # #29 — typecheck must pass before any deploy
  typecheck-gate:
    name: Typecheck gate
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.services != '[]'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Build shared
        run: cd shared && npm run build

      - name: Typecheck all services
        run: |
          for svc in auth user content watch-party notification admin; do
            echo "Checking $svc..."
            cd services/$svc && npm run typecheck && cd ../..
          done

      - name: Run unit tests (gate)
        run: |
          FAILED=0
          for svc in auth user content notification admin; do
            echo "Testing $svc..."
            cd services/$svc
            if npm run test --if-present 2>/dev/null; then
              echo "✅ $svc tests passed"
            else
              EXIT_CODE=$?
              if [ $EXIT_CODE -ne 0 ]; then
                echo "❌ $svc tests FAILED"
                FAILED=1
              fi
            fi
            cd ../..
          done
          if [ $FAILED -ne 0 ]; then
            echo "::error::One or more services failed tests — deploy blocked"
            exit 1
          fi

      - name: Install Chromium for web SEO gate
        if: contains(fromJSON(needs.changes.outputs.services), 'web')
        run: npx playwright install --with-deps chromium

      - name: Run web SEO quality gate
        if: contains(fromJSON(needs.changes.outputs.services), 'web')
        run: |
          npm run build --workspace=web
          npm run start --workspace=web -- -p 3000 > /tmp/wewatch-next.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ru > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/wewatch-next.log
              exit 1
            fi
            sleep 2
          done

          npm run test:seo
          npx playwright test apps/web/tests/performance-accessibility.spec.ts --project=web-chromium --workers=1
          npm run check:crawlers --workspace=web -- http://127.0.0.1:3000
          npx --yes lighthouse@12.8.2 http://127.0.0.1:3000/ru \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=/tmp/lighthouse-ru-mobile.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet
          node apps/web/scripts/check-lighthouse-budget.mjs /tmp/lighthouse-ru-mobile.json

  deploy-prod:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    environment: production
    needs: [changes, typecheck-gate]  # #29 — never deploy if typecheck fails
    if: |
      needs.changes.outputs.services != '[]' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'yes'))

    strategy:
      fail-fast: false
      max-parallel: 3
      # Deploy only the services that changed in this push
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }} to Railway
        run: railway up --service ${{ matrix.service }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health check — ${{ matrix.service }}
        run: |
          sleep 15
          SERVICE_URL=""
          HEALTH_PATH="/health"
          case "${{ matrix.service }}" in
            auth)         SERVICE_URL="${{ secrets.PROD_AUTH_URL }}" ;;
            user)         SERVICE_URL="${{ secrets.PROD_USER_URL }}" ;;
            content)      SERVICE_URL="${{ secrets.PROD_CONTENT_URL }}" ;;
            watch-part)   SERVICE_URL="${{ secrets.PROD_WATCH_PARTY_URL }}" ;;
            notification) SERVICE_URL="${{ secrets.PROD_NOTIFICATION_URL }}" ;;
            admin)        SERVICE_URL="${{ secrets.PROD_ADMIN_URL }}" ;;
            # Front-end services have no /health endpoint — probe an existing path
            web)          SERVICE_URL="${{ secrets.PROD_WEB_URL }}"; HEALTH_PATH="/" ;;
            app-web)      SERVICE_URL="${{ secrets.PROD_APP_WEB_URL }}"; HEALTH_PATH="/login" ;;
            admin-ui)     SERVICE_URL="${{ secrets.PROD_ADMIN_UI_URL }}"; HEALTH_PATH="/" ;;
          esac
          if [ -n "$SERVICE_URL" ]; then
            curl --fail --retry 3 --retry-delay 5 "$SERVICE_URL$HEALTH_PATH" || exit 1
          fi
