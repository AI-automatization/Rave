name: Deploy — Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Production ga deploy qilmoqchimisiz? (yes)"
        required: true
        default: 'no'

permissions:
  contents: read

jobs:
  # #29 — typecheck must pass before any deploy
  typecheck-gate:
    name: Typecheck gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b549b2bf1c05b7dac02bab2a6cc7e047 # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Build shared
        run: cd shared && npm run build

      - name: Typecheck all services
        run: |
          for svc in auth user content watch-party notification admin; do
            echo "Checking $svc..."
            cd services/$svc && npm run typecheck && cd ../..
          done

      - name: Run unit tests (gate)
        run: |
          FAILED=0
          for svc in auth user content notification admin; do
            echo "Testing $svc..."
            cd services/$svc
            if npm run test --if-present 2>/dev/null; then
              echo "✅ $svc tests passed"
            else
              EXIT_CODE=$?
              if [ $EXIT_CODE -ne 0 ]; then
                echo "❌ $svc tests FAILED"
                FAILED=1
              fi
            fi
            cd ../..
          done
          if [ $FAILED -ne 0 ]; then
            echo "::error::One or more services failed tests — deploy blocked"
            exit 1
          fi

  deploy-prod:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    environment: production
    needs: [typecheck-gate]  # #29 — never deploy if typecheck fails
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'yes'

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service:
          - auth
          - user
          - content
          - watch-party
          - notification
          - admin

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }} to Railway
        run: railway up --service ${{ matrix.service }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health check — ${{ matrix.service }}
        run: |
          sleep 15
          SERVICE_URL=""
          case "${{ matrix.service }}" in
            auth)         SERVICE_URL="${{ secrets.PROD_AUTH_URL }}" ;;
            user)         SERVICE_URL="${{ secrets.PROD_USER_URL }}" ;;
            content)      SERVICE_URL="${{ secrets.PROD_CONTENT_URL }}" ;;
            watch-party)  SERVICE_URL="${{ secrets.PROD_WATCH_PARTY_URL }}" ;;
            notification) SERVICE_URL="${{ secrets.PROD_NOTIFICATION_URL }}" ;;
            admin)        SERVICE_URL="${{ secrets.PROD_ADMIN_URL }}" ;;
          esac
          if [ -n "$SERVICE_URL" ]; then
            curl --fail --retry 3 --retry-delay 5 "$SERVICE_URL/health" || exit 1
          fi
