name: Build Mobile APK

# Очередь без отмены: сборка AAB/APK для стора прерывать на середине нельзя — останется
# промежуточное состояние. Группа нужна, чтобы два прогона не шли
# одновременно; экономия здесь второстепенна.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Manual only — builds the Android APK on GitHub's runners instead of a local machine.
# Requires EXPO_TOKEN in repo secrets (Expo Personal Access Token — the local build
# still needs to fetch the release keystore from Expo's servers even with --local).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  build:
    name: Build APK (${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    # Safety net: a Gradle daemon OOM crash during the actual build step doesn't
    # always propagate as a clean process exit (seen once — the job hung 6h until
    # GitHub's own hard ceiling force-killed it). Fail fast well before that.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root deps
        run: npm ci

      - name: Build shared
        run: cd shared && npm run build

      - name: Build APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # production profile's android.buildType is "app-bundle" (.aab, required for Play Store
        # submission) — preview/development build a plain .apk. --output must match that format
        # or eas-cli's local build errors out on the mismatched extension.
        run: |
          if [ "${{ github.event.inputs.profile }}" = "production" ]; then
            ext=aab
          else
            ext=apk
          fi
          echo "OUTPUT_EXT=$ext" >> "$GITHUB_ENV"
          npx eas-cli build --platform android --profile ${{ github.event.inputs.profile }} \
            --local --output "./wewatch.$ext" --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wewatch-${{ github.event.inputs.profile }}-${{ env.OUTPUT_EXT }}
          path: apps/mobile/wewatch.${{ env.OUTPUT_EXT }}
          # 7 вместо 14: APK 60 МБ и AAB 84 МБ на сборку, free-storage орги 500 МБ
          retention-days: 7
