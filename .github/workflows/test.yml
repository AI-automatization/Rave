name: Unit Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: [auth, user, content, notification, admin]
        include:
          - service: auth
            path: services/auth
          - service: user
            path: services/user
          - service: content
            path: services/content
          - service: notification
            path: services/notification
          - service: admin
            path: services/admin

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Build shared
        run: cd shared && npm run build

      - name: Run tests — ${{ matrix.service }}
        run: |
          cd ${{ matrix.path }}
          if [ -z "$(node -e "const p=require('./package.json'); process.stdout.write(p.scripts&&p.scripts.test||'')")" ]; then
            echo "::warning::No test script in ${{ matrix.service }}/package.json — add one"
          else
            npm test
          fi
        env:
          MONGO_URI: mongodb://localhost:27017/cinesync_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
