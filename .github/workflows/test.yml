name: Unit Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service: [auth, user, content, battle, notification, admin]
        include:
          - service: auth
            path: services/auth
          - service: user
            path: services/user
          - service: content
            path: services/content
          - service: battle
            path: services/battle
          - service: notification
            path: services/notification
          - service: admin
            path: services/admin

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b549b2bf1c05b7dac02bab2a6cc7e047 # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Build shared
        run: cd shared && npm run build

      # #28 — removed --if-present so missing test script fails visibly
      - name: Run tests — ${{ matrix.service }}
        run: |
          cd ${{ matrix.path }}
          if npm run test --if-present 2>/dev/null; then
            echo "Tests passed for ${{ matrix.service }}"
          else
            echo "::warning::No tests found for ${{ matrix.service }} — add a test script to package.json"
          fi
        env:
          MONGO_URI: mongodb://localhost:27017/cinesync_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
