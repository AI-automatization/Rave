# ВНИМАНИЕ: регулярный бэкап живёт НЕ здесь.
#
# Этот workflow существовал с первого дня и не отработал ни разу: 99 падений из
# 100 прогонов с «MONGO_URI is required», потому что секретов в репозитории нет
# и не будет. Репозиторий публичный, а в организации у 19 человек права admin по
# умолчанию (проверено 25.08.2026 через GitHub API) — любой может добавить шаг и
# вывести секрет в лог. Красная задача по расписанию при этом выглядела в списке
# Actions как работающая защита.
#
# С 25.08.2026 бэкап делает сервис `wewatch-backup` в проекте Railway `rave`:
# mongodump → GPG(AES256) → MinIO, ежедневно в 02:00 UTC, ретенция 30 дней.
# Строка подключения туда не копируется — подставляется ссылкой
# ${{ MongoDB.MONGO_URL }} и не покидает инфраструктуру Railway.
#
# Здесь остаётся только ручной запуск (workflow_dispatch) на случай разбора
# инцидента с чужой машины: он всё так же требует секретов и без них упадёт.
name: MongoDB Backup

on:
  # Расписание снято 25.08.2026: см. комментарий в шапке файла.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Backup MongoDB → S3
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install mongodump
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update -qq
          sudo apt-get install -y mongodb-org-tools

      - name: Run backup
        env:
          MONGO_URI: ${{ secrets.PROD_MONGO_URI }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION || 'us-east-1' }}
        run: bash scripts/backup-mongo.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::MongoDB backup FAILED at $(date -u)"
