name: SEO quality gate

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/seo-quality.yml'
  push:
    branches: [main, dev]
    paths:
      - 'apps/web/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/seo-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-quality:
    name: Build, crawl, accessibility and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Real gap found 2026-08-13: this script already existed in the repo (reads
      # page-context.ts's CLUSTER_BY_SLUG against every indexed guide/use-case page) but was
      # never wired into any pipeline — a guide added without a cluster entry doesn't fail
      # anything at runtime, it just silently reports as the `other` cluster in analytics, so
      # the drift was invisible until someone noticed the numbers looked wrong. Runs early
      # (reads TS source as text, no build/server needed) so it fails fast before the
      # Chromium install / build / Lighthouse steps below.
      - name: Analytics cluster coverage
        run: node apps/web/scripts/check-analytics-clusters.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build web
        run: npm run build --workspace=web

      - name: Start production web
        run: |
          npm run start --workspace=web -- -p 3000 > /tmp/wewatch-next.log 2>&1 &
          echo $! > /tmp/wewatch-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ru > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wewatch-next.log
          exit 1

      - name: SEO and structured-data regression
        run: npm run test:seo

      - name: Accessibility regression
        run: npx playwright test apps/web/tests/performance-accessibility.spec.ts --project=web-chromium --workers=1

      - name: Raw HTML crawler visibility
        run: npm run check:crawlers --workspace=web -- http://127.0.0.1:3000

      # 3 runs, not 1 — a cold-runner first try is not a stable signal (see
      # check-lighthouse-budget.mjs's own comment for the real incident this fixes: one flaky
      # TBT reading silently skipped the Railway deploy step for 13 days).
      - name: Lighthouse mobile audit (3 runs, median)
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@12.8.2 http://127.0.0.1:3000/ru \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path=/tmp/lighthouse-ru-mobile-$i.json \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet
          done

      - name: Enforce Lighthouse and transfer budgets (median of 3 runs)
        run: node apps/web/scripts/check-lighthouse-budget.mjs /tmp/lighthouse-ru-mobile-1.json /tmp/lighthouse-ru-mobile-2.json /tmp/lighthouse-ru-mobile-3.json

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/wewatch-next.log || true

      - name: Stop production web
        if: always()
        run: kill "$(cat /tmp/wewatch-next.pid)" 2>/dev/null || true
