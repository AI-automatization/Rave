version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: cinesync_mongo_prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data_prod:/data/db
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: cinesync_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: cinesync_es_prod
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
    volumes:
      - es_data_prod:/usr/share/elasticsearch/data
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: cinesync_auth
    restart: always
    env_file: ./services/auth/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    container_name: cinesync_user
    restart: always
    env_file: ./services/user/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  content:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    container_name: cinesync_content
    restart: always
    env_file: ./services/content/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  watch-party:
    build:
      context: .
      dockerfile: services/watch-party/Dockerfile
    container_name: cinesync_watch_party
    restart: always
    env_file: ./services/watch-party/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  battle:
    build:
      context: .
      dockerfile: services/battle/Dockerfile
    container_name: cinesync_battle
    restart: always
    env_file: ./services/battle/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: cinesync_notification
    restart: always
    env_file: ./services/notification/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    container_name: cinesync_admin
    restart: always
    env_file: ./services/admin/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  nginx:
    image: nginx:1.25-alpine
    container_name: cinesync_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth
      - user
      - content
      - watch-party
      - battle
      - notification
      - admin
    networks:
      - cinesync_network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

volumes:
  mongo_data_prod:
  redis_data_prod:
  es_data_prod:

networks:
  cinesync_network:
    driver: bridge
