# macOS packaging (M6). Unsigned for now (no Apple Developer account): users open it via
# System Settings → Privacy & Security → "Open Anyway". Auto-update (electron-updater) does NOT work
# for unsigned macOS apps, so it is not wired in.
appId: uz.wewatch.desktop
productName: WeWatch
directories:
  output: out
  buildResources: build
beforeBuild: scripts/before-build.cjs
afterPack: scripts/after-pack.cjs
files:
  - dist/**/*
  - "!dist/main/smoke.js" # development smoke driver, never loaded by the packaged app (index.ts)
  - "!dist/main/smoke.js.map"
  - package.json
# Runtime dependencies. beforeBuild returns false (monorepo: the builder would walk up to the repo root), so the builder
# collects no node_modules and ignores node_modules patterns under `files`. They are copied next to app.asar instead:
# Node resolves Resources/app.asar/dist/main/x.js → … → Resources/node_modules. Keep in step with
# `npm ls --omit=dev --all`; scripts/after-pack.cjs fails the build when one does not resolve from the packaged app.
extraResources:
  - { from: node_modules/@ghostery/adblocker, to: node_modules/@ghostery/adblocker }
  - { from: node_modules/@ghostery/adblocker-content, to: node_modules/@ghostery/adblocker-content }
  - { from: node_modules/@ghostery/adblocker-extended-selectors, to: node_modules/@ghostery/adblocker-extended-selectors }
  - { from: node_modules/@ghostery/url-parser, to: node_modules/@ghostery/url-parser }
  - { from: node_modules/@remusao/guess-url-type, to: node_modules/@remusao/guess-url-type }
  - { from: node_modules/@remusao/small, to: node_modules/@remusao/small }
  - { from: node_modules/@remusao/smaz, to: node_modules/@remusao/smaz }
  - { from: node_modules/@remusao/smaz-compress, to: node_modules/@remusao/smaz-compress }
  - { from: node_modules/@remusao/smaz-decompress, to: node_modules/@remusao/smaz-decompress }
  - { from: node_modules/@remusao/trie, to: node_modules/@remusao/trie }
  - { from: node_modules/tldts-core, to: node_modules/tldts-core }
  - { from: node_modules/tldts-experimental, to: node_modules/tldts-experimental }
  # The app's own build of the web app (scripts/build-web.sh → web-dist), run locally by src/main/local-web.ts.
  # `**/*` with dot files: the build lives in web-dist/.next; after-pack.cjs fails the build if server.js, .next/BUILD_ID
  # or .next/static is missing from the app.
  - { from: web-dist, to: web, filter: ["**/*", "**/.next/**/*"] }
  # A folder named node_modules inside `from` is skipped by the builder (measured 2026-11-13: web/node_modules was
  # missing); given as its own `from`, like the entries above, it is copied.
  - { from: web-dist/node_modules, to: web/node_modules }
protocols:
  - name: WeWatch
    schemes: [wewatch]
mac:
  category: public.app-category.entertainment
  identity: "-"
  # The microphone/camera need these under the hardened runtime (see the file's header comment).
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }
