<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <!-- The shell only ever runs its own script and stylesheet: no network, no inline script, no images. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
    <title>WeWatch</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div id="sidebar-drag"></div>
      <nav id="nav"></nav>
      <div id="profile" class="profile" hidden>
        <span id="avatar" class="avatar" aria-hidden="true"></span>
        <span class="who">
          <span id="who-name" class="name"></span>
          <span id="who-status" class="status"></span>
        </span>
      </div>
    </aside>
    <!-- Next to the traffic lights (always in the same place, whether the sidebar is open or not). -->
    <div id="controls">
      <button id="back" class="tool" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <button id="forward" class="tool" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>
    <header id="toolbar">
      <div class="brand"><svg class="logo" viewBox="0 0 112 90" fill="none" aria-hidden="true"><path d="M101 11 70 79 54 43 36 11" stroke="#7C3AED" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 11l31 68 17.5-37L76 11" stroke="#A78BFA" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg>WeWatch</div>
      <div class="spacer"></div>
      <div class="search-wrap" id="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" maxlength="100" hidden />
      </div>
      <div id="lang" class="lang" role="group" aria-label="Til / Язык" hidden><button type="button" data-l="uz">O'zbekcha</button><button type="button" data-l="ru">Русский</button></div>
      <button id="new-room" class="primary" type="button"><span aria-hidden="true">+</span><span id="new-room-label"></span></button>
    </header>
    <script src="shell.js"></script>
  </body>
</html>
