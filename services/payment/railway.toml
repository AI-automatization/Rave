# Railway config — payment service (port 3009)
# Root Directory in Railway dashboard: / (repo root)
# Config File Path in Railway dashboard: services/payment/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/payment/Dockerfile"
watchPatterns = ["services/payment/**", "shared/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
