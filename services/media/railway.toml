# Railway config — media service (content + watch-party in one process)
# Root Directory in Railway dashboard: / (repo root)
# Config File Path in Railway dashboard: services/media/railway.toml
# Rollback = keep deploying the two original services; nothing here changes them.
# Keep numReplicas = 1 (watch-party in-memory VB sessions + faststart cache are per-process).

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/media/Dockerfile"
watchPatterns = [
  "services/media/**",
  "services/content/**",
  "services/watch-party/**",
  "shared/**",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
